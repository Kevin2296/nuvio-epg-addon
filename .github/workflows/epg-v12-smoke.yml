name: Temporary v1.2 real EPG smoke test

on:
  push:
    branches: [feature/epg-source-fusion-streaming-v12]
    paths: [.github/workflows/epg-v12-smoke.yml]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Read two real public regional sources and verify XMLTV
        run: |
          python3 - <<'PY'
          import addon, gzip, xml.etree.ElementTree as ET
          from pathlib import Path
          addon.REGIONS = {k: v for k, v in addon.REGIONS.items() if k in ('NL', 'PL')}
          report = addon.generate(Path('smoke-out'))
          assert report['combined_channels'] > 100
          assert report['window_days'] == 14
          for region in ('all','nl','pl'):
              xml = gzip.decompress((Path('smoke-out')/'epg'/f'{region}.xml.gz').read_bytes())
              root = ET.fromstring(xml)
              print(region, 'channels', len(root.findall('channel')),
                    'programmes', len(root.findall('programme')),
                    'xml size', len(xml))
              assert len(root.findall('programme')) > 100
          assert report['source_status']['NL'] == 'fresh'
          print('Successful actual XMLTV generation with bounded concurrency')
          PY
